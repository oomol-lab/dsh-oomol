name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.14.4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack and install the published artifact shape
        shell: bash
        run: |
          artifact_dir="$(mktemp -d)"
          profile_dir="$(mktemp -d)"
          pnpm pack --pack-destination "$artifact_dir" >/dev/null
          artifact_path="$(find "$artifact_dir" -maxdepth 1 -name '*.tgz' -print -quit)"
          DSH_HOME="$profile_dir" pnpm exec dsh plugin --profile web add -w "$artifact_path"
          DSH_HOME="$profile_dir" pnpm exec dsh --profile web --dump-config > "$profile_dir/dump.yml"
          grep -q 'name: dsh-oomol' "$profile_dir/dump.yml"
          sed -n '/^# == dsh-oomol$/,$p' "$profile_dir/dump.yml" > "$profile_dir/plugin-dump.yml"
          if grep -Eq 'apiKeyEnv:|Authorization:|api_[A-Za-z0-9_-]{8,}' "$profile_dir/plugin-dump.yml"; then
            echo "credential-like value found in bundle dump" >&2
            exit 1
          fi
