# OOMOL Connector bundle for DeepSeek Harness.
#
# Secrets are resolved at runtime by the plugin from the Harness credentials
# service or the launching environment. They are intentionally absent here so
# `dsh --dump-config` cannot reveal an API key from this bundle layer.
- insert:
    - id: oomol
      name: dsh-oomol
      config:
        endpoint: https://connector.oomol.com/v1/mcp
        teamNameEnv: OOMOL_TEAM_NAME
        serverName: oomol
        toolCallTimeoutMs: 60000
        failOnStartupError: false
